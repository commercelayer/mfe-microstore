pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "packages/*/src/**/*.{js,jsx,ts,tsx,json,css}"
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: ts-check
      run: pnpm ts:check
