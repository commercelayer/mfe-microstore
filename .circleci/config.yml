version: 2.1

orbs:
  aws-cli: circleci/aws-cli@4.1.3
  aws-s3: circleci/aws-s3@4.0.0

image: &image
  docker:
    - image: cimg/node:24.18.0
  resource_class: medium+

setup: &setup
  - run:
      name: Setup
      command: |
        sudo npm install -g pnpm
        pnpm install

jobs:
  test:
    <<: *image
    steps:
      - checkout
      - <<: *setup
      - run:
          name: Audit
          command: pnpm audit --audit-level high && pnpm audit || exit 0
      - run:
          name: Lint
          command: pnpm check
      - run:
          name: Test
          command: pnpm test
  e2e:
    docker:
      # keep the tag in sync with the installed @playwright/test version
      - image: mcr.microsoft.com/playwright:v1.63.0-noble
    resource_class: medium+
    environment:
      PUBLIC_PROJECT_PATH: microstore
    steps:
      - checkout
      - run:
          name: Setup
          # Playwright noble image runs as root and ships without sudo
          command: |
            npm install -g pnpm
            pnpm install
      - run:
          name: E2E tests
          working_directory: packages/microstore
          command: pnpm test:e2e
      - store_test_results:
          path: packages/microstore/test-results/junit.xml
      - store_artifacts:
          path: packages/microstore/playwright-report
          destination: playwright-report
      - store_artifacts:
          path: packages/microstore/test-results
          destination: test-results
  build:
    <<: *image
    environment:
      PUBLIC_PROJECT_PATH: microstore
    steps:
      - checkout
      - <<: *setup
      - run:
          name: Build
          command: pnpm build
      - aws-cli/setup:
          aws_access_key_id: AWS_ACCESS_KEY
          aws_secret_access_key: AWS_SECRET_ACCESS_KEY
      - aws-s3/sync:
          from: packages/microstore/build
          to: "s3://$S3_ASSETS_BUCKET/team/fe-static-apps/$PUBLIC_PROJECT_PATH/<<pipeline.git.tag>>"

workflows:
  run-tests:
    jobs:
      - test:
          context: commercelayer
          filters:
            tags:
              ignore: /v.*/
      - e2e:
          context: commercelayer
          filters:
            tags:
              ignore: /v.*/

  test-build-and-push:
    jobs:
      - test:
          context: commercelayer
          filters:
            tags:
              only: /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*).*/
            branches:
              ignore: /.*/
      - e2e:
          context: commercelayer
          filters:
            tags:
              only: /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*).*/
            branches:
              ignore: /.*/
      - build:
          requires:
            - test
            - e2e
          context: commercelayer
          filters:
            tags:
              only: /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*).*/
            branches:
              ignore: /.*/
